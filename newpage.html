<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tabela</title>
  <style>
    body {
      font-family: cursive;
      
    }
    table {
      border-collapse: collapse;
      text-align: center;
      margin: auto;
    }

    td,th {
      border: 1.5px solid black;
      padding: 10px;
    }
  </style>
</head>
<body>
  <table >
    <thead>
      <th scope="col">nomes</th>
      <th scope="colgroup">temporadas</th>
      <th scope="col">episodios</th>
    </thead>
    <tbody>
      <tr>
        <td>one piece</td>
        <td>2</td>
        <td>1429</td>
      </tr>
      <tr>
        <td>black clover</td>
        <td>5</td>
        <td>171</td>
      </tr>
      <tr>
        <td>slime/reicanation</td>
        <td>6</td>
        <td>101</td>
      </tr>
      <tr>
        <td>classroom of the elite</td>
        <td>3</td>
        <td>38</td>
      </tr>
      <tr>
        <th scope="rowgroup" colspan="3">animes recentes</th>
      </tr>
      <tr>
         <td>demons shadons realm</td>
         <td>1/em andamento</td>
         <td>18</td>
      </tr>
      <tr>
        <td>tomb raider king</td>
        <td>1/em andamentos</td>
        <td>5</td>
      </tr>

    </tbody>
  </table>
  
</body>
</html>
