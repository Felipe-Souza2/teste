<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Myself</title>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
  <link rel="stylesheet" href="estilos/style.css">
  <link rel="stylesheet" href="estilos/crosswise.css">
</head>
  <body>
    <main>
      <section id="conteiner">
        <div id="img">

        </div>
        <div class="text">
          <h1>Login</h1>
          <p>Acesse aqui a  Tabela de animes apos o acesso</p>
        <form action="newpage.html" method="post" autocomplete="on">
          </div>
          <div class="campo">
            <input type="email" name="email" id="iemail" required placeholder="seu e-mail" minlength="5" autocomplete="email">
            <label for="iemail">name</label>
            <span class="material-symbols-outlined">Person</span>
          </div>
          <div class="campo">
            <input type="password" name="senha" id="isenha" required placeholder="password" minlength="6" autocomplete="current-password">
            <label for="isenha">senha</label>
            <span class="material-symbols-outlined">vpn_key</span>
          </div>
          <div class="buttom">
            <input type="submit" value="Entrar">
            <input type="reset" value="Limpar">
          </div>
        </form>
      </section>
    </main>
  </body>
</html>
